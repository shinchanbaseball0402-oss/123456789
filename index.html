<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | K&Y GOLF STUDIO</title>
  <style>
    :root {
      --primary-green: #0a2f1d;
      --ocean-blue: #0f3854;
      --accent-gold: #c5a059;
      --bg-light: #f7f9fa;
      --text-dark: #222222;
      --text-light: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Helvetica Neue", Arial, sans-serif; color: var(--text-dark); background: var(--bg-light); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }

    /* ヘッダー */
    header { position: sticky; top: 0; z-index: 100; background: rgba(10,47,29,0.95); border-bottom: 2px solid var(--accent-gold); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { color: var(--text-light); font-size: 1.5rem; font-weight: bold; }
    .logo span { color: var(--accent-gold); }
    nav ul { display: flex; list-style: none; gap: 1.2rem; }
    nav a { color: var(--text-light); font-size: 0.95rem; }
    nav a:hover, nav a.active { color: var(--accent-gold); font-weight: bold; }

    /* 見出し */
    .page-title { background: var(--primary-green); color: var(--text-light); text-align: center; padding: 3rem 1rem; }

    /* メインコンテンツ */
    section { padding: 4rem 5%; max-width: 800px; margin: 0 auto; }
    .contact-card { background: #fff; border-radius: 10px; padding: 2.5rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    /* フォームパーツ */
    .form-group { margin-bottom: 1.5rem; text-align: left; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; color: var(--primary-green); }
    .form-group label .required { color: #d9534f; font-size: 0.8rem; margin-left: 0.3rem; }
    
    .form-control { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
    .form-control:focus { outline: none; border-color: var(--accent-gold); box-shadow: 0 0 5px rgba(197, 160, 89, 0.5); }
    textarea.form-control { resize: vertical; min-height: 120px; }

    .btn-submit { display: block; width: 100%; background: linear-gradient(135deg, var(--accent-gold), #dfba73); color: var(--primary-green); border: none; padding: 1rem; font-size: 1.1rem; font-weight: bold; border-radius: 50px; cursor: pointer; transition: opacity 0.2s; margin-top: 2rem; }
    .btn-submit:hover { opacity: 0.9; }

    /* フッター */
    footer { background: var(--primary-green); color: var(--text-light); text-align: center; padding: 2rem 1rem; margin-top: 3rem; border-top: 3px solid var(--accent-gold); }
  </style>
</head>
<body>

  <header>
    <div class="logo">K&Y <span>GOLF STUDIO</span></div>
    <nav>
      <ul>
        <li><a href="./index.html">ホーム</a></li>
        <li><a href="./about.html">代表紹介</a></li>
        <li><a href="./price.html">料金プラン</a></li>
        <li><a href="./access.html">アクセス</a></li>
        <li><a href="./contact.html" class="active">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-title">
    <h1>お問い合わせ（CONTACT）</h1>
    <p style="margin-top:0.5rem;">レッスン体験のご予約・ご質問などお気軽にご連絡ください</p>
  </div>

  <section>
    <div class="contact-card">
      <!-- フォーム送信先には Formspree などの無料フォームサービスを適用可能です -->
      <form action="#" method="POST">
        
        <div class="form-group">
          <label for="name">お名前 <span class="required">※必須</span></label>
          <input type="text" id="name" name="name" class="form-control" placeholder="山田 太郎" required>
        </div>

        <div class="form-group">
          <label for="email">メールアドレス <span class="required">※必須</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
          <label for="phone">電話番号</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="090-0000-0000">
        </div>

        <div class="form-group">
          <label for="category">お問い合わせ種別</label>
          <select id="category" name="category" class="form-control">
            <option value="体験レッスンについて">体験レッスンについて</option>
            <option value="一般コースについて">一般コースについて</option>
            <option value="ジュニアコースについて">ジュニアコースについて</option>
            <option value="その他">その他・ご質問</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">お問い合わせ内容 <span class="required">※必須</span></label>
          <textarea id="message" name="message" class="form-control" placeholder="ご希望の日時やご質問事項をご記入ください" required></textarea>
        </div>

        <button type="submit" class="btn-submit">送信する</button>

      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 K&Y GOLF STUDIO</p>
  </footer>

</body>
</html>
